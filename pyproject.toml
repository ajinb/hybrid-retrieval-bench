[project]
name = "hybrid-retrieval-bench"
version = "0.1.0"
description = "BM25, dense, reciprocal rank fusion and cross-encoder reranking compared on three BeIR datasets, with paired confidence intervals."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Ajin Baby" }]
dependencies = ["numpy", "fastembed", "PyStemmer"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://cloudandsre.com"
Repository = "https://github.com/ajinb/hybrid-retrieval-bench"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
